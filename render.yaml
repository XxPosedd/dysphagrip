services:
  - type: web
    name: dysphagrip
    runtime: docker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_READ_ONLY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: BRIGHTDATA_ZONE
        sync: false
